<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d"><title id="t">Measure the whole clamping surface</title><desc id="d">A desk cross-section shows the top pad, lower clamp pad, thickness measurement and an underside support rail that can obstruct a clamp. Original schematic, not an installation template.</desc><rect width="720" height="320" fill="#e9eee5"/><g stroke="#193f35" stroke-width="3" fill="none"><path d="M145 130h475v42H145z" fill="#cbbb9c"/><path d="M255 172v72h45v-72" fill="#cbbb9c"/><path d="M158 113h55v17h-55z" fill="#193f35"/><path d="M158 117h-25v106h54v-39"/><path d="M171 179h32v7h-32z" fill="#193f35"/><path d="M170 221h36"/></g><g stroke="#b2502e" stroke-width="1.5" fill="none"><path d="M96 130v42m-8-42h16m-16 42h16M210 111l54-34M304 224l97 36"/><path d="M222 195h30" stroke-dasharray="4 3"/></g><g fill="#193f35" font-family="Georgia,serif" font-size="18"><text x="26" y="105">Measure</text><text x="26" y="124">here</text><text x="272" y="72">Contact must be flat</text><text x="402" y="270">Rails can block the lower pad</text></g><text x="30" y="301" fill="#52665b" font-family="monospace" font-size="11" letter-spacing="1.4">ILLUSTRATION ONLY · CHECK THE EXACT MOUNT MANUAL</text></svg>